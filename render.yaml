# Render Blueprint deployment spec for AIGA (AI Village & Spatial Planning Engine)
# Autonomous MCP Tool Provider & 3D Web Dashboard for JamotLite

services:
  - type: web
    name: aiga-mcp
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: CESIUM_ION_TOKEN
        sync: false
      # Asara, the onboarding guide: Gemini (preferred when set) or OpenAI
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      # Asara's voice (ElevenLabs): she speaks her lines, and families can answer by voice
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_AGENT_ID
        sync: false
      # Optional: a payment link for voluntary contributions that keep Asara running (Stripe Payment Link, PayPal.me, Ko-fi)
      - key: CONTRIBUTE_URL
        sync: false
      # Optional: a separate J-Mission entry point for land offers
      - key: JMISSION_LAND_ENTRY_POINT
        sync: false
      # Applications go to J-Mission through an "api" entry point of the AIGA Village business
      - key: JMISSION_URL
        value: https://j-mission.onrender.com
      - key: JMISSION_API_KEY
        sync: false
      - key: JMISSION_ENTRY_POINT
        sync: false
      # Protects the MCP endpoints (/sse, /messages) and the KMZ upload
      - key: AIGA_ADMIN_TOKEN
        sync: false
